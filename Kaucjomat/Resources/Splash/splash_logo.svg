<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#DC2626"/>

  <!-- Ticket/Voucher Icon -->
  <g transform="translate(96, 156)">
    <!-- Main ticket body -->
    <rect x="0" y="0" width="320" height="200" rx="20" fill="white"/>

    <!-- Left notch -->
    <circle cx="0" cy="100" r="25" fill="#DC2626"/>

    <!-- Right notch -->
    <circle cx="320" cy="100" r="25" fill="#DC2626"/>

    <!-- Dashed line in the middle -->
    <line x1="40" y1="100" x2="80" y2="100" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="140" y2="100" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="100" x2="200" y2="100" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <line x1="220" y1="100" x2="260" y2="100" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <line x1="280" y1="100" x2="280" y2="100" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>

    <!-- Top decorative elements -->
    <rect x="60" y="40" width="80" height="20" rx="10" fill="#DC2626"/>
    <rect x="180" y="40" width="80" height="20" rx="10" fill="#DC2626"/>

    <!-- Bottom decorative elements -->
    <rect x="60" y="140" width="200" height="16" rx="8" fill="#FEE2E2"/>
    <rect x="60" y="170" width="120" height="12" rx="6" fill="#FEE2E2"/>
  </g>
</svg>
